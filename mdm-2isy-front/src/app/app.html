<!-- Vue PLEIN ÉCRAN pour la page de connexion -->
<ng-container *ngIf="isLoginPage">
  <router-outlet></router-outlet>
</ng-container>

<!-- Vue APPLICATION (Dashboard, Terminaux) avec le menu latéral -->
<ng-container *ngIf="!isLoginPage">
  <div class="app-viewport animate-fade-up">
    <div class="app-shell">
      <div class="mobile-scrim" [class.show]="menuOpen" (click)="closeMenu()"></div>
      <aside class="app-sidebar" [class.open]="menuOpen">
        <app-sidebar (navigate)="closeMenu()"></app-sidebar>
      </aside>

      <div class="app-main">
        <app-header (menuToggle)="toggleMenu()"></app-header>
        <main class="app-content">
           <router-outlet></router-outlet>
        </main>
      </div>
    </div>
  </div>
</ng-container>
