<div class="sidebar-panel h-100 d-flex flex-column position-relative">
  <div class="brand-lockup px-3 pt-4 pb-3 d-flex align-items-center gap-3">
    <div class="brand-mark">
      <img src="/branding/mdm-2isy-logo.png" alt="Logo 2ISY MDM">
    </div>
    <div class="min-w-0">
      <div class="brand-name">2ISY MDM</div>
      <div class="brand-caption">Device control center</div>
    </div>
  </div>
  
  <!-- Section Profil Utilisateur Dynamique -->
  <div class="user-card d-flex align-items-center gap-3 mx-3 mb-3 p-3">
      <div class="user-avatar d-inline-flex align-items-center justify-content-center fw-bold"
           aria-hidden="true">
        {{ usrInitials }}
      </div>
    <div class="min-w-0">
      <h6 class="fw-bold m-0 text-white text-truncate">{{ usrName }}</h6>
      <small class="text-white-50">{{ usrRole }}</small>
    </div>
  </div>
  
  <!-- Menu de navigation -->
  <ul class="nav flex-column px-3 gap-1 my-1 sidebar-menu flex-grow-1 overflow-y-auto" style="overflow-x: hidden;">
    <li class="nav-item w-100" *ngFor="let item of menuItems">
      <a class="nav-link rounded-4 d-flex align-items-center py-2 px-3 text-white text-decoration-none" 
         [routerLink]="item.route" 
         routerLinkActive="active-menu" (click)="onNavigate()">
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label text-truncate flex-grow-1">{{ item.label }}</span>
        <span *ngIf="item.badge" class="badge rounded-pill bg-danger" style="font-size: 0.70rem;">{{ item.badge }}</span>
      </a>
    </li>
  </ul>

  <!-- Bouton de déconnexion en bas -->
  <div class="p-3 mt-auto border-top border-white border-opacity-10">
    <button type="button" (click)="logout()" [disabled]="isLoggingOut"
            class="logout-button d-flex align-items-center py-2 px-3 text-white rounded-4 border-0 w-100 text-start">
      <span class="me-3 fs-5" style="width: 22px; text-align: center;">🚪</span> 
      <span style="font-size: 0.85rem;">{{ isLoggingOut ? 'Déconnexion...' : 'Déconnexion' }}</span>
    </button>
  </div>
</div>
