<div class="container-fluid p-0">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold m-0">Utilisateurs et rôles</h3>
      <p class="text-muted small m-0">Administrateurs, opérateurs et accès en lecture seule</p>
    </div>
    <div class="d-flex gap-2">
      <select *ngIf="isSuperAdmin" [(ngModel)]="selectedOrganizationId" (ngModelChange)="loadUsers()" class="form-select">
        <option [ngValue]="null">Toutes les organisations</option>
        <option *ngFor="let organization of organizations" [ngValue]="organization.id">{{ organization.name }}</option>
      </select>
      <button (click)="openModal()" [disabled]="isSuperAdmin && !selectedOrganizationId" class="btn btn-primary text-nowrap">+ Ajouter</button>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light"><tr><th class="px-4">Nom</th><th>Email</th><th>Organisation</th><th>Rôle</th><th></th></tr></thead>
      <tbody>
        <tr *ngIf="loading"><td colspan="5" class="text-center p-5 text-muted">Chargement...</td></tr>
        <tr *ngFor="let user of users">
          <td class="px-4 fw-bold">{{ user.name }}</td><td>{{ user.email }}</td>
          <td>{{ user.organization?.name || '—' }}</td>
          <td><span class="badge bg-primary-subtle text-primary">{{ roleLabel(user.role) }}</span></td>
          <td class="text-end px-4"><button (click)="remove(user)" class="btn btn-sm btn-outline-danger">Supprimer</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="showModal" class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" style="background: rgba(0,0,0,.5); z-index: 1050;">
    <div class="card border-0 shadow-lg rounded-4 p-4" style="width: 100%; max-width: 480px;">
      <h5 class="fw-bold mb-4">Nouvel utilisateur</h5>
      <label class="form-label">Nom</label><input [(ngModel)]="form.name" class="form-control mb-3">
      <label class="form-label">Email</label><input [(ngModel)]="form.email" type="email" class="form-control mb-3">
      <label class="form-label">Rôle</label>
      <select [(ngModel)]="form.role" class="form-select mb-3">
        <option value="viewer">Lecteur — consultation uniquement</option>
        <option value="operator">Opérateur — commandes non destructives</option>
        <option *ngIf="isSuperAdmin" value="admin">Administrateur — gestion complète du client</option>
      </select>
      <label class="form-label">Mot de passe provisoire</label><input [(ngModel)]="form.password" type="password" minlength="12" class="form-control mb-4">
      <div class="d-flex justify-content-end gap-2">
        <button (click)="showModal = false" [disabled]="saving" class="btn btn-light">Annuler</button>
        <button (click)="save()" [disabled]="saving || form.password.length < 12" class="btn btn-primary">{{ saving ? 'Création...' : 'Créer' }}</button>
      </div>
    </div>
  </div>
</div>
