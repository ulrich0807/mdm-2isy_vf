<div class="h-100 d-flex flex-column animate-fade-up position-relative">
  <!-- En-tête transparent par dessus la carte -->
  <div class="location-toolbar position-absolute top-0 start-0 w-100 p-4 d-flex justify-content-between align-items-center" style="z-index: 1000; background: linear-gradient(to bottom, rgba(255,255,255,0.95), rgba(255,255,255,0)); pointer-events: none;">
    <div>
      <h3 class="fw-bold text-dark m-0" style="text-shadow: 0px 2px 10px rgba(255,255,255,0.8);">Trafic en temps réel</h3>
      <p class="text-muted fw-bold m-0 mt-1">Supervision globale de la flotte des livreurs</p>
    </div>
    
    <div *ngIf="!currentHistoryTerminal" class="bg-white rounded-pill px-4 py-2 shadow-sm d-flex align-items-center gap-3 border" style="pointer-events: auto;">
      <div class="d-flex align-items-center gap-2">
        <span class="bg-success rounded-circle" style="width: 10px; height: 10px;"></span>
        <span class="small fw-bold text-dark">Actifs</span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="bg-warning rounded-circle" style="width: 10px; height: 10px;"></span>
        <span class="small fw-bold text-dark">Hors Ligne</span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="bg-danger rounded-circle" style="width: 10px; height: 10px;"></span>
        <span class="small fw-bold text-dark">Alerte / Verrouillé</span>
      </div>
    </div>
    
    <div *ngIf="currentHistoryTerminal" class="bg-primary text-white rounded-pill px-4 py-2 shadow-sm d-flex align-items-center gap-3" style="pointer-events: auto;">
      <span class="fw-bold">Historique 24h : {{ currentHistoryTerminal.livreur }}</span>
      <button class="btn btn-sm btn-light rounded-pill fw-bold" (click)="fermerTrajet()">Fermer</button>
    </div>
  </div>

  <!-- Conteneur Carte Plein Ecran -->
  <div class="flex-grow-1 position-relative rounded-4 overflow-hidden shadow-sm border m-3 mt-0" style="min-height: 500px;">
    <div id="fullscreenMap" style="position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 1;"></div>
    
    <!-- Bouton flottant refresh -->
    <button class="btn btn-white position-absolute top-0 end-0 m-3 rounded-circle shadow-sm d-flex align-items-center justify-content-center border" 
            style="width: 45px; height: 45px; z-index: 1000;" 
            (click)="chargerDonnees()" title="Rafraîchir maintenant">
      <span class="fs-5">🔄</span>
    </button>
  </div>
</div>

<style>
/* Animation customisée pour le ping vert */
@keyframes glow-pulse {
  0% { box-shadow: 0 0 0 0 rgba(25, 135, 84, 0.7); }
  70% { box-shadow: 0 0 0 15px rgba(25, 135, 84, 0); }
  100% { box-shadow: 0 0 0 0 rgba(25, 135, 84, 0); }
}
.pulse-animation {
  animation: glow-pulse 2s infinite;
}
.marker-pin {
  transition: transform 0.3s ease;
}
.marker-pin:hover {
  transform: scale(1.15);
  z-index: 1000;
}
</style>
